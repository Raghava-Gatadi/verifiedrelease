name: Supply-chain security lab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13'}
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r security/requirements.lock
          python scripts/release/install_tools.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Check workflow syntax and policy tests
        run: |
          actionlint
          python -m unittest discover -s release_tests -v
      - name: Build, scan, enforce policy and demonstrate rejection
        run: python scripts/release/local_check.py
      - name: Preserve security and rejection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supply-chain-evidence
          path: |
            artifacts/release/*.json
            artifacts/rejection-demo/
          retention-days: 14
          if-no-files-found: error
